<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scan backfill</title>
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/machine.css" />
    <link rel="stylesheet" href="/app.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to page</a>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <h1>Scan backfill</h1>
          <span class="network" id="network">—</span>
        </div>
        <div class="top-actions">
          <span class="connection" id="connection"
            ><span class="dot" aria-hidden="true"></span
            ><span id="connection-label">Connecting</span></span
          ><button id="theme" class="quiet">Dark mode</button>
        </div>
      </header>
      <main id="main" tabindex="-1">
        <div id="notice" class="notice" role="status" hidden></div>
        <noscript><p class="notice">Enable JavaScript to use this page.</p></noscript>
        <p class="small muted" id="backfill-status" role="status" hidden></p>
        <table class="compare" id="compare-result" hidden>
          <caption class="sr-only">Scan comparison</caption>
          <tbody>
            <tr><th scope="row">Default</th><td id="cmp-default-n"></td><td id="cmp-default-usdc"></td></tr>
            <tr><th scope="row">balanceChanged</th><td id="cmp-full-n"></td><td id="cmp-full-usdc"></td></tr>
          </tbody>
          <tfoot>
            <tr><th scope="row">Difference</th><td id="cmp-missed-n"></td><td id="cmp-missed-usdc"></td></tr>
          </tfoot>
        </table>
        <section class="pipeline" aria-label="Scan rig">
          <div class="machine" id="machine">
            <p id="machine-loading" class="small muted">Loading machine…</p>
          </div>
          <div class="machine-toolbar">
            <div class="machine-actions">
              <button class="quiet" id="compare-run" disabled>Compare</button
              ><button class="quiet" id="backfill-run" disabled>Run backfill</button
              ><button class="quiet" id="reset-run" disabled>Reset</button>
            </div>
          </div>
          <ul class="machine-legend" aria-label="Machine destinations">
            <li><span class="result credited">Credited</span></li>
            <li><span class="result duplicate">Skipped</span></li>
          </ul>
        </section>
        <section class="activity" aria-label="Activity">
          <table>
            <caption class="sr-only">Recent transactions</caption>
            <thead>
              <tr>
                <th scope="col">Transaction</th>
                <th scope="col" class="numeric">USDC</th>
                <th scope="col">Result</th>
              </tr>
            </thead>
            <tbody id="transactions">
              <tr><td colspan="3" class="empty">No transactions yet.</td></tr>
            </tbody>
          </table>
        </section>
      </main>
    </div>
    <p id="announcer" class="sr-only" role="status" aria-live="polite"></p>
  </body>
</html>
